permissions:
  contents: write

jobs:
  publish:
    name: Publish extension repo
    needs: [prepare, build]
    if: >-
      !cancelled()
      && needs.prepare.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ~/apk-artifacts

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: 25
          distribution: temurin

      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          path: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download extensions inspector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSPECTOR_LINK="$(curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/komikku-app/aniyomi-extensions-inspector/releases/latest" | jq -er '.assets[0].browser_download_url')"
          curl -fL --retry 3 "$INSPECTOR_LINK" -o "$RUNNER_TEMP/Inspector.jar"

      - name: Create repo artifacts
        run: |
          cd ${{ github.ref_name }}
          python ./.github/scripts/move-built-apks.py
          java -jar "$RUNNER_TEMP/Inspector.jar" "repo/apk" "output.json" "tmp"
          python ./.github/scripts/create-repo.py

      - name: Checkout repo target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Ensure repo branch exists
        working-directory: ./repo
        run: |
          if git show-ref --verify --quiet refs/heads/repo; then
            git checkout repo
          else
            git checkout -b repo
          fi

      - name: Merge repo
        env:
          DELETE: ${{ needs.prepare.outputs.delete }}
        run: |
          cd repo
          python ../${{ github.ref_name }}/.github/scripts/merge-repo.py "$DELETE" '${{ github.ref_name }}/repo'

      - name: Deploy repo
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8
        with:
          message: "${{ needs.prepare.outputs.latestCommitMessage }}"
          cwd: "./repo"